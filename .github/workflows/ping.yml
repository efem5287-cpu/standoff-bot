name: Continuous Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Loop
        run: |
          for i in {1..5}; do
            curl -s https://standoff-bot-4.onrender.com > /dev/null
            echo "Ping atıldı: $i"
            sleep 60
          done
          
